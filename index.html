<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitX — Agentic Swarm &amp; Thought Graph</title>
  <!-- Ter-Manager Plugin Host SDK -->
  <script src="/plugin-host.js"></script>
  <!-- GitX Styling -->
  <link rel="stylesheet" href="css/gitx.css">
</head>
<body>

  <!-- Top Header Bar -->
  <header class="gitx-header">
    <div class="gitx-logo">
      <span class="logo-icon">⎇</span>
      <span class="logo-text">GitX</span>
      <span class="badge">Agentic Swarm</span>
    </div>

    <!-- Active Project / Workspace Indicator (Synced from Ter-Manager) -->
    <div class="active-project-badge" id="active-project-badge">
      <span class="proj-icon">📁</span>
      <b>Detecting Project...</b>
    </div>

    <div class="gitx-status-bar">
      <div class="status-indicator">
        <span class="status-dot" id="broker-status-dot"></span>
        <span id="broker-status-text">Connecting Broker...</span>
      </div>
      <button type="button" class="btn-header" id="btn-new-issue">+ New Task / Prompt</button>
    </div>
  </header>

  <!-- 3-Column Main Grid -->
  <main class="gitx-container">

    <!-- Column 1: Active Agent Swarm Deck -->
    <section class="panel">
      <div class="panel-head">
        <span class="panel-title">
          <span class="panel-icon">🤖</span> Agent Swarm Deck
        </span>
      </div>
      <div class="panel-body" id="swarm-agents-list">
        <!-- Populated dynamically by app.js -->
      </div>
    </section>

    <!-- Column 2: the commit graph, with the thinking between commits -->
    <section class="panel main-panel">
      <div class="panel-head">
        <span class="panel-title">
          <span class="panel-icon">⎇</span> Commit &amp; Thought Graph
        </span>
        <span class="tg-summary" id="tg-summary"></span>
        <div class="tg-modes" role="group" aria-label="Thoughts in the graph">
          <button type="button" data-mode="code">Code only</button>
          <button type="button" data-mode="collapsed">Thoughts collapsed</button>
          <button type="button" data-mode="expanded">Thoughts expanded</button>
        </div>
      </div>
      <div class="panel-body tg-scroll">
        <div class="tg-list" id="tg-list"></div>
      </div>
    </section>

    <!-- Column 3: whatever is selected - a commit, a thought, or the overview -->
    <section class="panel">
      <div class="panel-head">
        <span class="panel-title" id="tg-detail-title">Overview</span>
      </div>
      <div class="panel-body tg-detail" id="tg-detail"></div>
    </section>

  </main>

  <!-- Bottom deck: which outcomes to show, and search over commits and thoughts -->
  <footer class="gitx-search-deck">
    <div class="layer-toggle-group" role="group" aria-label="Show thoughts by outcome">
      <button type="button" class="btn-layer-toggle active" data-outcome="accepted"><span class="tg-dot o-accepted"></span>Accepted</button>
      <button type="button" class="btn-layer-toggle active" data-outcome="rejected"><span class="tg-dot o-rejected"></span>Rejected</button>
      <button type="button" class="btn-layer-toggle active" data-outcome="stashed"><span class="tg-dot o-stashed"></span>Stashed</button>
      <button type="button" class="btn-layer-toggle active" data-outcome="open"><span class="tg-dot o-open"></span>Open</button>
    </div>
    <div class="search-input-wrapper">
      <label for="layer-search-input" class="tg-sr">Search commits and thoughts</label>
      <input type="text" class="search-input" id="layer-search-input" placeholder="Search commits and thoughts..." autocomplete="off" spellcheck="false">
    </div>
  </footer>

  <!-- Modal for Creating New Task / Prompt Issue -->
  <div class="modal-backdrop" id="issue-modal" hidden>
    <div class="modal-card">
      <div class="modal-title">Create Task Issue &amp; Feature Branch</div>
      <div class="form-group">
        <label for="input-issue-title">Task Title</label>
        <input type="text" class="form-input" id="input-issue-title" placeholder="e.g. Customizable UI for Paint App">
      </div>
      <div class="form-group">
        <label for="input-issue-branch">Feature Branch Name</label>
        <input type="text" class="form-input" id="input-issue-branch" placeholder="e.g. feat/customizable-ui">
      </div>
      <div class="form-group">
        <label for="input-issue-prompt">Prompt Specification (Instructions for Assigned Agent)</label>
        <textarea class="form-textarea" id="input-issue-prompt" placeholder="Detail the exact requirements, files, inputs, and behavior the agent must build..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="modal-cancel-btn">Cancel</button>
        <button type="button" class="btn-primary" id="modal-submit-btn">Spawn Issue &amp; Branch</button>
      </div>
    </div>
  </div>

  <script src="js/graph-view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
